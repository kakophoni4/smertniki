services:
  bot:
    build: .
    container_name: rusprofile-monitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "${CRM_API_PORT:-8088}:8088"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/bot.db
      CRM_API_HOST: 0.0.0.0
      CRM_API_PORT: 8088
